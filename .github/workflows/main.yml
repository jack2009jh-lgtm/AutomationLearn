name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Project
      run: unzip -o *.zip

    - name: Fix Compose Compiler Plugin
      run: |
        cat << 'EOF' > fix_build.py
        root_build = """plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.serialization) apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
        }
        """
        with open("build.gradle.kts", "w", encoding="utf-8") as f:
            f.write(root_build)

        with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
            app_content = f.read()

        target = "alias(libs.plugins.kotlin.serialization)"
        replacement = target + '\n    id("org.jetbrains.kotlin.plugin.compose")'

        if 'plugin.compose' not in app_content:
            app_content = app_content.replace(target, replacement)
            with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
                f.write(app_content)
        EOF
        python3 fix_build.py

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Ai-automation-engineer-APK
        path: app/build/outputs/apk/debug/*.apk
